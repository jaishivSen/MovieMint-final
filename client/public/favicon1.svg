<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="redGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff1f1f"/>
      <stop offset="100%" stop-color="#b30000"/>
    </linearGradient>

    <linearGradient id="darkRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8a0000"/>
      <stop offset="100%" stop-color="#520000"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Left Film Strip -->
  <polygon
    points="90,90 170,160 170,420 90,350"
    fill="url(#redGradient)"
    filter="url(#glow)"
  />

  <!-- Right Film Strip -->
  <polygon
    points="422,90 342,160 342,420 422,350"
    fill="url(#redGradient)"
    filter="url(#glow)"
  />

  <!-- Main M -->
  <polygon
    points="90,90 256,240 422,90 422,150 256,310 90,150"
    fill="url(#redGradient)"
    filter="url(#glow)"
  />

  <!-- Inner Shadow -->
  <polygon
    points="170,160 256,240 342,160 256,310"
    fill="url(#darkRed)"
    opacity="0.55"
  />

  <!-- Left Film Holes -->
  <rect x="108" y="135" width="18" height="18" rx="2" fill="black"/>
  <rect x="108" y="185" width="18" height="18" rx="2" fill="black"/>
  <rect x="108" y="235" width="18" height="18" rx="2" fill="black"/>
  <rect x="108" y="285" width="18" height="18" rx="2" fill="black"/>

  <!-- Right Film Holes -->
  <rect x="386" y="135" width="18" height="18" rx="2" fill="black"/>
  <rect x="386" y="185" width="18" height="18" rx="2" fill="black"/>
  <rect x="386" y="235" width="18" height="18" rx="2" fill="black"/>
  <rect x="386" y="285" width="18" height="18" rx="2" fill="black"/>

</svg>