<svg width="1800" height="600" viewBox="0 0 1800 600" fill="none" xmlns="http://www.w3.org/2000/svg">

  <!-- Gradients -->
  <defs>
    <linearGradient id="mainRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF1A1A"/>
      <stop offset="100%" stop-color="#D50000"/>
    </linearGradient>

    <linearGradient id="darkRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#B80000"/>
      <stop offset="100%" stop-color="#6B0000"/>
    </linearGradient>

    <!-- Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- LEFT STRIP -->
  <polygon points="120,120 260,240 260,500 120,380"
           fill="url(#mainRed)"
           filter="url(#glow)"/>

  <!-- LEFT INNER -->
  <polygon points="120,120 185,175 185,435 120,380"
           fill="url(#darkRed)"
           opacity="0.45"/>

  <!-- RIGHT STRIP -->
  <polygon points="520,120 380,240 380,500 520,380"
           fill="url(#mainRed)"
           filter="url(#glow)"/>

  <!-- RIGHT INNER -->
  <polygon points="520,120 455,175 455,435 520,380"
           fill="url(#darkRed)"
           opacity="0.45"/>

  <!-- TOP M -->
  <polygon points="120,120 320,300 520,120 520,190 320,370 120,190"
           fill="url(#mainRed)"
           filter="url(#glow)"/>

  <!-- CENTER SHADE -->
  <polygon points="260,240 320,300 380,240 320,370"
           fill="url(#darkRed)"
           opacity="0.5"/>

  <!-- FILM HOLES LEFT -->
  <rect x="145" y="180" width="26" height="26" rx="3" fill="#000"/>
  <rect x="145" y="250" width="26" height="26" rx="3" fill="#000"/>
  <rect x="145" y="320" width="26" height="26" rx="3" fill="#000"/>
  <rect x="145" y="390" width="26" height="26" rx="3" fill="#000"/>

  <!-- FILM HOLES RIGHT -->
  <rect x="469" y="180" width="26" height="26" rx="3" fill="#000"/>
  <rect x="469" y="250" width="26" height="26" rx="3" fill="#000"/>
  <rect x="469" y="320" width="26" height="26" rx="3" fill="#000"/>
  <rect x="469" y="390" width="26" height="26" rx="3" fill="#000"/>

  <!-- TEXT -->
  <text x="650"
        y="375"
        fill="url(#mainRed)"
        font-family="Poppins, Arial, sans-serif"
        font-size="220"
        font-weight="700"
        letter-spacing="1"
        filter="url(#glow)">
    MovieMint
  </text>

</svg>